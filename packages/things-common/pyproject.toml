[project]
name = "things-common"
version = "0.1.0"
description = "Shared secure runtime, receipt, lock, redaction, and integrity primitives for Things++ MCP servers"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["things_common"]
