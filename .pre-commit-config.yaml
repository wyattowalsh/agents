minimum_pre_commit_version: '3.0.0'
repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint (config-driven)
        entry: uv run ruff check
        language: system
        pass_filenames: false
        files: \.py$
      - id: ruff-format
        name: Ruff format (config-driven)
        entry: uv run ruff format --check
        language: system
        pass_filenames: false
        files: \.py$
      - id: ty
        name: Type-check Python code
        entry: uv run ty check
        language: system
        pass_filenames: false
        files: \.py$
      - id: wagents-validate
        name: Validate skills and agents
        entry: uv run wagents validate
        language: system
        pass_filenames: false
        files: ^(skills/|agents/)
      - id: apm-materialize-check
        name: Check APM materialize freshness
        entry: uv run wagents apm materialize --check
        language: system
        pass_filenames: false
        files: ^(agents/|instructions/|config/hook-registry\.json|config/hook-surface-registry\.json|apm\.yml|\.apm/)
      - id: apm-doctor
        name: APM surface doctor
        entry: uv run wagents apm doctor
        language: system
        pass_filenames: false
        files: ^(apm\.yml|\.apm/|opencode\.json)$
      - id: openspec-validate
        name: Validate OpenSpec changes and specs
        entry: uv run wagents openspec validate
        language: system
        pass_filenames: false
        files: ^openspec/
      - id: catalog-index-check
        name: Check skills catalog index freshness
        entry: uv run wagents catalog index --check
        language: system
        pass_filenames: false
        files: ^(docs/src/authoring/skills/.*\.mdx|skills/.*/SKILL\.md)$
      - id: readme-check
        name: Check README freshness
        entry: uv run wagents readme --check
        language: system
        pass_filenames: false
        files: ^(README\.md|wagents/readme\.py|docs/src/authoring/|skills/.*/SKILL\.md|agents/)
      - id: docs-generate-check
        name: Check docs generate freshness
        entry: uv run wagents docs generate --no-installed --check
        language: system
        pass_filenames: false
        files: ^(docs/|skills/|agents/|wagents/docs)
      - id: docs-compose-check
        name: Check composed docs freshness
        entry: uv run wagents docs compose --check-composed --min-pct 100
        language: system
        pass_filenames: false
        files: ^(docs/src/content/docs/skills/|skills/.*/SKILL\.md)
      - id: sync-stack-check
        name: Check agent stack sync freshness
        entry: uv run python scripts/check_agent_stack.py
        language: system
        pass_filenames: false
        files: ^(instructions/|config/sync-manifest\.json|\.claude/rules/|wagents/platforms/)
      - id: actionlint
        name: Lint GitHub Actions workflows
        entry: actionlint
        language: system
        pass_filenames: false
        files: ^\.github/workflows/.*\.ya?ml$
