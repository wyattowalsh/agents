[project]
name = "mcp-source-url-health"
version = "0.1.0"
description = "Read-only MCP server that checks the reachability of skill/agent/mcp source URLs over HTTP"
requires-python = ">=3.13"
dependencies = ["fastmcp>=2", "httpx>=0.28.1", "wagents"]

[tool.uv.sources]
wagents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
