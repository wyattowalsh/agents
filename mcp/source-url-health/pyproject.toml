[project]
name = "mcp-source-url-health"
version = "0.1.0"
description = "Read-only MCP server that checks the reachability of skill/agent/mcp source URLs over HTTP"
requires-python = ">=3.13"
dependencies = ["fastmcp>=2", "httpx>=0.28.1", "idna>=3.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_source_url_health"]
