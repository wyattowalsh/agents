[project]
name = "mcp-sandbox-profiles"
version = "0.1.0"
description = "Stub MCP server for sandbox profile reference data"
requires-python = ">=3.13"
dependencies = ["fastmcp>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
