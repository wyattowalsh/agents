[project]
name = "mcp-docs-graph"
version = "0.1.0"
description = "Read-only MCP server exposing docs/public/generated-reports/docs-graph-snapshot.json"
requires-python = ">=3.13"
dependencies = ["fastmcp>=2", "wagents"]

[tool.uv.sources]
wagents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
