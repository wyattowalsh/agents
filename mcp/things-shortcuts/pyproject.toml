[project]
name = "mcp-things-shortcuts"
version = "0.1.0"
description = "Typed fixed-name Things Shortcuts MCP bridge"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=3.4.7,<4",
  "pydantic>=2.12,<3",
  "things-common",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.uv.sources]
things-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["things_shortcuts"]
include = ["things_shortcuts/protocol/*.json"]
