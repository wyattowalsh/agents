[project]
name = "mcp-docs-index"
version = "0.1.0"
description = "Read-only MCP server exposing generated docs reports (docs/public/generated-reports/*.json) and content page metadata"
requires-python = ">=3.13"
dependencies = ["fastmcp>=2", "wagents"]

[tool.uv.sources]
wagents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
