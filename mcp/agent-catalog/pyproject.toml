[project]
name = "mcp-agent-catalog"
version = "0.1.0"
description = "Read-only MCP server exposing the repo agent catalog (agents/, agent -> skill/mcp cross-reference edges)"
requires-python = ">=3.13"
dependencies = ["fastmcp>=2", "wagents"]

[tool.uv.sources]
wagents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
