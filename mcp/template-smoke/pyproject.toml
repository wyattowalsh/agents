[project]
name = "mcp-template-smoke"
version = "0.1.0"
description = "Read-only MCP server for dry-run MCP scaffold and layout validation"
requires-python = ">=3.13"
dependencies = ["fastmcp>=2", "wagents"]

[tool.uv.sources]
wagents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
