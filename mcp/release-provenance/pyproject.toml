[project]
name = "mcp-release-provenance"
version = "0.1.0"
description = "Read-only MCP server for release and provenance manifests and workflows"
requires-python = ">=3.13"
dependencies = ["fastmcp>=2", "wagents", "pyyaml>=6"]

[tool.uv.sources]
wagents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
