[project]
name = "mcp-oauth-reference"
version = "0.1.0"
description = "Read-only OAuth MCP configuration reference shape for maintainers"
requires-python = ">=3.13"
dependencies = ["fastmcp>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
