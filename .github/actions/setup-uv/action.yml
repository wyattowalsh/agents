name: Setup uv workspace
description: Set up uv and sync Python dependencies with uv caching.
inputs:
  enable-cache:
    description: Enable uv dependency cache via astral-sh/setup-uv
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: ${{ inputs.enable-cache }}
    - run: uv sync
      shell: bash
