name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3d9b4d4f8b53728782 # v4
      - uses: ./.github/actions/setup-uv
      - run: uv run ruff check
      - run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3d9b4d4f8b53728782 # v4
      - uses: ./.github/actions/setup-uv
      - run: uv run ty check --output-format github --no-progress

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3d9b4d4f8b53728782 # v4
      - uses: ./.github/actions/setup-uv
      - run: uv run pytest --cov=wagents --cov-report=term-missing

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3d9b4d4f8b53728782 # v4
      - uses: ./.github/actions/setup-uv
      - run: uv run wagents validate
      - run: uv run wagents readme --check
      - run: uv run wagents apm materialize --check
      - run: uv run wagents apm doctor
      - run: uv run pytest tests/test_skills_catalog_schemas.py tests/test_catalog_index_parity.py tests/test_skill_index.py tests/test_authoring_sync.py tests/test_apm_materialize.py tests/test_wagents_self.py -q --tb=line
      - run: uv run wagents openspec validate
      - run: SKILL_PORTABLE_CI=1 uv run pytest tests/test_skill_portability.py tests/test_skill_bundled_toolkit.py tests/test_skills_no_wagents.py tests/test_skills_p7_operator_paths.py tests/test_namer_catalog_parity.py tests/test_composed_catalog_script_parity.py tests/test_package.py -q --tb=line
      - run: uv run python scripts/sync_skill_portability.py --check
      - run: uv run wagents skills sync --dry-run
      - run: uv run wagents catalog index --check
      - run: uv run python scripts/sync_agent_stack.py --check --targets repo

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3d9b4d4f8b53728782 # v4
      - uses: ./.github/actions/setup-uv
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" -o "${archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
          mkdir -p "$HOME/.local/bin"
          mv actionlint "$HOME/.local/bin/actionlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install just
        env:
          JUST_VERSION: 1.55.1
          JUST_SHA256: b0ef600f0df20d5ae91ae931627c499fc52b477ffe5f5ea7b7b3ec616b16c778
        run: |
          archive="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL "https://github.com/casey/just/releases/download/${JUST_VERSION}/${archive}" -o "${archive}"
          printf '%s  %s\n' "${JUST_SHA256}" "${archive}" | sha256sum -c -
          tar -xzf "${archive}" just
          mkdir -p "$HOME/.local/bin"
          mv just "$HOME/.local/bin/just"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just ci-check

  apm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3d9b4d4f8b53728782 # v4
      - uses: ./.github/actions/setup-uv
      - run: uv pip install apm-cli==0.21.0
      - run: apm audit --ci --no-drift
      - run: |
          if [ -f apm.lock.yaml ]; then
            apm install --frozen --only apm
          else
            echo "No apm.lock.yaml; skipping frozen install"
          fi

  wagents-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3d9b4d4f8b53728782 # v4
      - uses: ./.github/actions/setup-uv
      - run: uv build
      - run: uv tool install "$(find dist -maxdepth 1 -name 'wagents-*.whl' -print -quit)" --force
      - run: wagents self doctor --format json
      - run: wagents validate

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3d9b4d4f8b53728782 # v4
      - uses: ./.github/actions/setup-uv
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
          package_json_file: docs/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: uv run wagents docs generate --no-installed --check
      - run: uv run wagents catalog index --check
      - run: uv run wagents docs compose --check-composed --min-pct 100 --write-manifest
      - run: uv run wagents docs lint
      - run: cd docs && pnpm install --frozen-lockfile
      - run: cd docs && pnpm run check:admin-redirect
      - run: cd docs && pnpm exec astro check
      - run: cd docs && pnpm build

  hook-perf:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3d9b4d4f8b53728782 # v4
      - uses: ./.github/actions/setup-uv
      - name: Hook perf inventory and assurance
        run: |
          uv run python scripts/hooks/hook_assurance.py --json
          uv run python <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          repo = Path(".")
          baseline_path = repo / "docs/public/generated-reports/hook-perf-baseline-bundle.json"
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          proc = subprocess.run(
              ["uv", "run", "python", "scripts/hooks/hook_perf_inventory.py", "--tier", "bundle", "--json"],
              capture_output=True,
              text=True,
              check=True,
          )
          live = json.loads(proc.stdout)
          expected = int(baseline["summary"]["total_spawns"])
          actual = int(live["summary"]["total_spawns"])
          if actual > expected:
              print(
                  f"bundle spawn regression: live {actual} > committed baseline {expected}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print(f"bundle spawns OK: {actual} <= baseline {expected}")
          PY
          uv run pytest tests/hooks/test_performance_baseline.py tests/hooks/test_bundle_dispatch.py tests/hooks/test_hook_perf_inventory_tier.py -q --tb=line
