name: Files Buddy

on:
  push:
    branches: [main]
    paths:
      - skills/files-buddy/**
      - tests/test_files_buddy_runtime.py
      - .github/workflows/files-buddy.yml
  pull_request:
    branches: [main]
    paths:
      - skills/files-buddy/**
      - tests/test_files_buddy_runtime.py
      - .github/workflows/files-buddy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: files-buddy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-and-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # macOS /private is a protected target. Fixtures stay in the owned runner
      # workspace temporary directory, outside repository/project boundaries.
      TMPDIR: ${{ runner.temp }}
    defaults:
      run:
        working-directory: skills/files-buddy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3d9b4d4f8b53728782 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: skills/files-buddy/uv.lock
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv run python scripts/check.py --tests
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check

  rendered-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3d9b4d4f8b53728782 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: uv sync --locked --group dev
      - run: node skills/files-buddy/tests/dashboard-behavior.cjs
      - run: uv run python -m playwright install --with-deps chromium
      - name: Verify desktop, mobile, keyboard, and error states
        run: |
          uv run python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          import playwright

          environment = os.environ.copy()
          environment['FILES_BUDDY_TEST_PYTHON'] = sys.executable
          environment['FILES_BUDDY_PLAYWRIGHT_MODULE'] = str(
              Path(playwright.__file__).parent / 'driver' / 'package'
          )
          subprocess.run(
              [
                  'node',
                  'skills/files-buddy/tests/dashboard-browser.cjs',
                  str(Path(os.environ['RUNNER_TEMP']) / 'files-buddy-browser'),
              ],
              env=environment,
              check=True,
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: files-buddy-browser
          path: ${{ runner.temp }}/files-buddy-browser
          if-no-files-found: warn
