name: Bootstrap ChatGPT Exporter

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-chatgpt-exporter.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-chatgpt-exporter
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3d9b4d4f8b53728782 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Materialize verified payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chatgpt-exporter/payload.part* | base64 --decode > /tmp/chatgpt-exporter.tar.xz
          printf '%s  %s\n' 'd2a48597e564e3f118d6a74fb088788246531893299da38b5db0dcc84fe5b1fc' /tmp/chatgpt-exporter.tar.xz | sha256sum -c -
          tar -xJf /tmp/chatgpt-exporter.tar.xz -C .
          rm -rf .bootstrap/chatgpt-exporter
          rm -f .github/workflows/bootstrap-chatgpt-exporter.yml
      - name: Validate userscript
        working-directory: tools/userscripts/chatgpt-exporter
        run: |
          set -euo pipefail
          node scripts/build.mjs --check
          node --check src/core.js
          node --check src/app.js
          node --check chatgpt-exporter.user.js
          node --test tests/core.test.mjs
          node scripts/check.mjs
      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(userscript): add agent-ready ChatGPT exporter"
          git push origin HEAD:main
