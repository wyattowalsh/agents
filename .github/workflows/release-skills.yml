name: Release Skills

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3d9b4d4f8b53728782 # v4
      - uses: ./.github/actions/setup-uv
      - name: Validate assets
        run: uv run wagents validate
      - name: Audit skills (strict)
        run: uv run python skills/skill-creator/scripts/audit.py --all --strict
      - name: Run tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check
      - name: Format check
        run: uv run ruff format --check
      - name: Type check
        run: uv run ty check --output-format github --no-progress

  package-and-release:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1635ceea3d9b4d4f8b53728782 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Package all skills
        run: uv run wagents package --all --output dist/
      - name: Verify packaging artifacts
        run: |
          test -f dist/manifest.json || { echo "Missing dist/manifest.json"; exit 1; }
          count=$(find dist -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')
          test "$count" -gt 0 || { echo "No .zip files in dist/"; exit 1; }
          echo "Found $count skill ZIP(s) and manifest.json"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.zip
            dist/manifest.json
          generate_release_notes: true
